<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Life Events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Случайные жизненные ситуации</h1>
        <p id="event-text">Нажми кнопку, чтобы получить случайную ситуацию.</p>
        <button onclick="generateEvent()">Сгенерировать ситуацию</button>
        <div id="choices"></div>
        <p id="result"></p>
        <button id="next-event" style="display: none;" onclick="generateEvent()">Следующее событие</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
